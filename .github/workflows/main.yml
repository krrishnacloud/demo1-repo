name: CI/CD 
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
   REPOSITORY_URL: ${{ vars.AWS_ECR_REPOSITORY_URL }}
   
jobs:
  ECR:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v3
        with:
           token: ${{ secrets.LOGIN_GITHUB_TOKEN }}

      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
           aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
           aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
           aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Commit ID
        run: echo "COMMIT_ID=${GITHUB_SHA::7}" >> $GITHUB_ENV
      
      - name: Build Docker image
        run: docker build -t web-portfolio:${COMMIT_ID} .

      - name: Tag image
        run: docker tag web-portfolio:${COMMIT_ID} "${REPOSITORY_URL}:${COMMIT_ID}"

      - name: Push to ECR
        run: docker push "${REPOSITORY_URL}:${COMMIT_ID}"

      - name: Update deployment file
        run: |
          yq e ".spec.template.spec.containers[0].image = \"${REPOSITORY_URL}:${COMMIT_ID}\"" -i kubernetes/deployment.yml
          cat kubernetes/deployment.yml
      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name eksclluster

      - name: Apply deployment to EKS
        run: kubectl apply -f kubernetes/deployment.yml
             kubectl apply -f kubernetes/service.yml
      - name: Commit updated deployment
        run: |
            git config --global user.email "krishavemula423@gmail.com"
            git config --global user.name "krrishnacloud"
            git add kubernetes/deployment.yml
            git commit -m "Update deployment image to ${COMMIT_ID}"
            git push


      

        


      

      
        
             
      
